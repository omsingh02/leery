<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FX lab</title>
    <link rel="icon" href="data:," />
    <style>
      /* The lab styles itself: Tailwind only scans src/, so utilities used here wouldn't exist. */
      html, body { background: #07040f; margin: 0; color: #f6f1e7; font-family: "Inter Variable", system-ui, sans-serif; }
      #root { min-height: 100dvh; }
      .lab-stage { position: fixed; inset: 0; touch-action: none; cursor: crosshair; user-select: none; -webkit-user-select: none; }
      .lab-felt { position: absolute; left: 6%; right: 6%; top: 11%; bottom: 36%; border-radius: 999px;
        background: radial-gradient(120% 90% at 50% 30%, hsl(168 56% 15%), hsl(172 64% 6%));
        box-shadow: inset 0 0 0 1px hsl(166 84% 50% / .28), inset 0 0 90px #0008, 0 0 0 5px hsl(258 34% 9%); }
      .lab-hint { position: absolute; left: 0; right: 0; top: 46%; text-align: center; color: #fff6; font-size: 13px; letter-spacing: .08em; pointer-events: none; }
      .lab-hud { position: fixed; top: 0; left: 0; right: 0; z-index: 80; display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 12px;
        font: 600 11px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; background: #07040fcc; backdrop-filter: blur(8px); border-bottom: 1px solid #ffffff14; }
      .lab-hud b { color: #fbbf24; font-weight: 700; }
      .lab-panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 80; max-height: 52dvh; overflow: auto; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        background: #0d0720ee; backdrop-filter: blur(14px); border-top: 1px solid #ffffff1a; }
      .lab-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
      .lab-row > span.k { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #a79fc4; min-width: 54px; }
      .lab-btn { appearance: none; border: 1px solid #ffffff22; background: #ffffff0d; color: inherit; border-radius: 999px; padding: 7px 12px; font: 600 12px/1 inherit; cursor: pointer; }
      .lab-btn:active { transform: scale(.96); }
      .lab-btn[data-on="true"] { background: linear-gradient(135deg, #8b5cf6, #ec4899); border-color: transparent; }
      .lab-btn.red { border-color: #ff3d6c88; } .lab-btn.mint { border-color: #14ebb988; } .lab-btn.gold { border-color: #fcc42c88; } .lab-btn.violet { border-color: #8b5cf688; }
      .lab-slider { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #cfc7e8; }
      .lab-slider input[type=range] { width: 120px; accent-color: #8b5cf6; }
      .lab-slider output { min-width: 34px; text-align: right; font: 600 11px ui-monospace, monospace; color: #fff; }
      .lab-title { font: 800 13px "Unbounded Variable", system-ui; letter-spacing: .02em; margin-right: 6px; }
      .lab-demo { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); width: 120px; height: 168px; border-radius: 12px; pointer-events: none;
        background: linear-gradient(160deg, hsl(256 56% 24%), hsl(262 62% 11%)); border: 1px solid #8b5cf673; box-shadow: 0 10px 30px -8px #000a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/dev/fx.tsx"></script>
  </body>
</html>
